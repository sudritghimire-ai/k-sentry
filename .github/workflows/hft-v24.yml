name: HFT v24 rare-path attack
on:
 workflow_dispatch:
 push:
  paths: ['hft_v24.sv','.github/workflows/hft-v24.yml']
jobs:
 timing:
  runs-on: ubuntu-latest
  strategy:
   fail-fast: false
   matrix:
    top: [seq_fast24_bench, packetfence2_phase24_bench, hft_hot24_bench]
    freq: [300,322,333,350,375,400]
    seed: [1,2,3,4,5]
  steps:
   - uses: actions/checkout@v5
   - uses: YosysHQ/setup-oss-cad-suite@v4
     with: {github-token: "${{ secrets.GITHUB_TOKEN }}"}
   - run: chmod +x synth_ecp5.sh
   - name: P&R
     continue-on-error: true
     run: ./synth_ecp5.sh hft_v24.sv ${{ matrix.top }} ${{ matrix.freq }} ${{ matrix.seed }}
   - uses: actions/upload-artifact@v4
     if: always()
     with:
      name: v24-${{ matrix.top }}-${{ matrix.freq }}-${{ matrix.seed }}
      path: build/${{ matrix.top }}_${{ matrix.freq }}_${{ matrix.seed }}
