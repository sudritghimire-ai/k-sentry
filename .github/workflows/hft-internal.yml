name: HFT internal integration
on:
 workflow_dispatch:
 push:
  paths: ['hft_internal_v11.sv','.github/workflows/hft-internal.yml']
jobs:
 synth:
  runs-on: ubuntu-latest
  strategy:
   fail-fast: false
   matrix:
    top: [complete_internal_state_bench]
    freq: [300,333,350,400]
    seed: [1,2,3,4,5]
  steps:
   - uses: actions/checkout@v5
   - uses: YosysHQ/setup-oss-cad-suite@v4
     with: {github-token: "${{ secrets.GITHUB_TOKEN }}"}
   - run: chmod +x synth_ecp5.sh
   - name: P&R
     continue-on-error: true
     run: ./synth_ecp5.sh hft_internal_v11.sv ${{ matrix.top }} ${{ matrix.freq }} ${{ matrix.seed }}
   - uses: actions/upload-artifact@v4
     if: always()
     with:
      name: internal-${{ matrix.freq }}-${{ matrix.seed }}
      path: build/${{ matrix.top }}_${{ matrix.freq }}_${{ matrix.seed }}
