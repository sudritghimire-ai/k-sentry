name: HFT v14 full core
on:
 workflow_dispatch:
 push:
  paths: ['hft_full_v14.sv','.github/workflows/hft-full-v14.yml']
jobs:
 synth:
  runs-on: ubuntu-latest
  strategy:
   fail-fast: false
   matrix:
    top: [hft_full_core_v14_bench]
    freq: [333,350,375,400]
    seed: [1,2,3,4,5]
  steps:
   - uses: actions/checkout@v5
   - uses: YosysHQ/setup-oss-cad-suite@v4
     with: {github-token: "${{ secrets.GITHUB_TOKEN }}"}
   - run: chmod +x synth_ecp5.sh
   - name: P&R
     continue-on-error: true
     run: ./synth_ecp5.sh hft_full_v14.sv ${{ matrix.top }} ${{ matrix.freq }} ${{ matrix.seed }}
   - uses: actions/upload-artifact@v4
     if: always()
     with:
      name: fullv14-${{ matrix.freq }}-${{ matrix.seed }}
      path: build/${{ matrix.top }}_${{ matrix.freq }}_${{ matrix.seed }}
