name: HFT fastpath attack
on:
  workflow_dispatch:
  push:
    paths:
      - 'hft_fastpath_v3.sv'
      - '.github/workflows/hft-fastpath.yml'
jobs:
  synth:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        top: [seq64_eq_only_bench, seq32_stream_bench, seq16_stream_bench, packetfence17_bench, hft_stream32_packetfence_bench]
        freq: [250, 300, 333, 400]
        seed: [1,2,3,4,5]
    steps:
      - uses: actions/checkout@v5
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: chmod +x synth_ecp5.sh
      - name: Synthesize and place-route
        continue-on-error: true
        run: ./synth_ecp5.sh hft_fastpath_v3.sv ${{ matrix.top }} ${{ matrix.freq }} ${{ matrix.seed }}
      - name: Summarize
        if: always()
        shell: bash
        run: |
          D="build/${{ matrix.top }}_${{ matrix.freq }}_${{ matrix.seed }}"
          echo "### ${{ matrix.top }} @ ${{ matrix.freq }} MHz seed ${{ matrix.seed }}" >> "$GITHUB_STEP_SUMMARY"
          grep -E "Max frequency|logic, .* routing" "$D/nextpnr.log" | tail -10 >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fastpath-${{ matrix.top }}-${{ matrix.freq }}-${{ matrix.seed }}
          path: build/${{ matrix.top }}_${{ matrix.freq }}_${{ matrix.seed }}
