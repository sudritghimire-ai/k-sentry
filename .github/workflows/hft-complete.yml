name: HFT complete state attack
on:
  workflow_dispatch:
  push:
    paths: ['hft_complete_v8.sv','.github/workflows/hft-complete.yml']
jobs:
  synth:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        top: [seq64_count_update_bench, complete_state_update_bench]
        freq: [350,400,450,500]
        seed: [1,2,3,4,5]
    steps:
      - uses: actions/checkout@v5
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with: {github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - run: chmod +x synth_ecp5.sh
      - name: P&R
        continue-on-error: true
        run: ./synth_ecp5.sh hft_complete_v8.sv ${{ matrix.top }} ${{ matrix.freq }} ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-${{ matrix.top }}-${{ matrix.freq }}-${{ matrix.seed }}
          path: build/${{ matrix.top }}_${{ matrix.freq }}_${{ matrix.seed }}
